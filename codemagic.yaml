workflows:
  ios-release:
    name: StarForge Family iOS release
    instance_type: mac_mini_m2
    max_build_duration: 90

    environment:
      groups:
        - starforge_firebase_ios
        - appstore_credentials
      flutter: 3.44.1
      xcode: latest
      vars:
        API_BASE_URL: "https://starforge.78.111.91.113.nip.io"
        BUNDLE_ID: "com.starforge.starforgeStudent"

    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache

    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: main
          include: true
          source: false
      cancel_previous_builds: true

    scripts:
      - name: Load and validate Firebase iOS configuration
        script: |
          set -eu
          test -n "${IOS_FIREBASE_SECRET:-}"
          FIREBASE_PLIST="$CM_BUILD_DIR/ios/Runner/GoogleService-Info.plist"
          printf '%s' "$IOS_FIREBASE_SECRET" > "$FIREBASE_PLIST"
          plutil -lint "$FIREBASE_PLIST"
          FIREBASE_PROJECT_ID="$(/usr/libexec/PlistBuddy -c 'Print :PROJECT_ID' "$FIREBASE_PLIST")"
          FIREBASE_SENDER_ID="$(/usr/libexec/PlistBuddy -c 'Print :GCM_SENDER_ID' "$FIREBASE_PLIST")"
          FIREBASE_API_KEY="$(/usr/libexec/PlistBuddy -c 'Print :API_KEY' "$FIREBASE_PLIST")"
          FIREBASE_APP_ID="$(/usr/libexec/PlistBuddy -c 'Print :GOOGLE_APP_ID' "$FIREBASE_PLIST")"
          FIREBASE_BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :BUNDLE_ID' "$FIREBASE_PLIST")"
          FIREBASE_STORAGE_BUCKET="$(/usr/libexec/PlistBuddy -c 'Print :STORAGE_BUCKET' "$FIREBASE_PLIST" 2>/dev/null || true)"
          test "$FIREBASE_BUNDLE_ID" = "$BUNDLE_ID"
          {
            printf 'STARFORGE_FIREBASE_PROJECT_ID=%s\n' "$FIREBASE_PROJECT_ID"
            printf 'STARFORGE_FIREBASE_MESSAGING_SENDER_ID=%s\n' "$FIREBASE_SENDER_ID"
            printf 'STARFORGE_FIREBASE_IOS_API_KEY=%s\n' "$FIREBASE_API_KEY"
            printf 'STARFORGE_FIREBASE_IOS_APP_ID=%s\n' "$FIREBASE_APP_ID"
            printf 'STARFORGE_FIREBASE_STORAGE_BUCKET=%s\n' "$FIREBASE_STORAGE_BUCKET"
          } >> "$CM_ENV"

      - name: Validate App Store Connect credentials
        script: |
          set -eu
          test -n "${APP_STORE_CONNECT_KEY_IDENTIFIER:-}"
          test -n "${APP_STORE_CONNECT_ISSUER_ID:-}"
          test -n "${APP_STORE_CONNECT_PRIVATE_KEY:-}"
          test -n "${CERTIFICATE_PRIVATE_KEY:-}"

      - name: Enable Flutter Swift Package Manager
        script: flutter config --enable-swift-package-manager

      - name: Resolve Flutter dependencies
        script: flutter pub get

      - name: Verify formatting
        script: dart format --output=none --set-exit-if-changed lib test tool

      - name: Audit frontend calls against OpenAPI
        script: >-
          dart run tool/openapi_workflow_audit.dart
          contracts/starforge-openapi.json
          contracts/openapi-extensions.json
          lib

      - name: Analyze
        script: flutter analyze --no-pub

      - name: Run tests
        script: flutter test --no-pub --concurrency=1 -r expanded

      - name: Configure App Store signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Build signed iOS IPA
        script: |
          flutter build ipa --release --no-pub \
            --build-number="$PROJECT_BUILD_NUMBER" \
            --dart-define="API_BASE_URL=$API_BASE_URL" \
            --dart-define="STARFORGE_FIREBASE_PROJECT_ID=$STARFORGE_FIREBASE_PROJECT_ID" \
            --dart-define="STARFORGE_FIREBASE_MESSAGING_SENDER_ID=$STARFORGE_FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define="STARFORGE_FIREBASE_IOS_API_KEY=$STARFORGE_FIREBASE_IOS_API_KEY" \
            --dart-define="STARFORGE_FIREBASE_IOS_APP_ID=$STARFORGE_FIREBASE_IOS_APP_ID" \
            --dart-define="STARFORGE_FIREBASE_IOS_BUNDLE_ID=com.starforge.starforgeStudent" \
            --dart-define="STARFORGE_FIREBASE_STORAGE_BUCKET=${STARFORGE_FIREBASE_STORAGE_BUCKET:-}" \
            --export-options-plist=/Users/builder/export_options.plist

      - name: Verify signed iOS push artifact
        script: |
          set -eu
          IPA_PATH="$(find build/ios/ipa -name '*.ipa' -print -quit)"
          test -n "$IPA_PATH"
          CHECK_DIR="$(mktemp -d)"
          unzip -q "$IPA_PATH" -d "$CHECK_DIR"
          APP_PATH="$(find "$CHECK_DIR/Payload" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          ACTUAL_BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")"
          test "$ACTUAL_BUNDLE_ID" = "$BUNDLE_ID"
          codesign --verify --deep --strict "$APP_PATH"
          codesign -d --entitlements :- "$APP_PATH" > "$CHECK_DIR/app-entitlements.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :aps-environment' "$CHECK_DIR/app-entitlements.plist")" = "production"
          test -f "$APP_PATH/embedded.mobileprovision"
          security cms -D -i "$APP_PATH/embedded.mobileprovision" > "$CHECK_DIR/profile.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:aps-environment' "$CHECK_DIR/profile.plist")" = "production"

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: api_key
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
