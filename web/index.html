<!DOCTYPE html>
<html lang="uz">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="StarForge EDU — student and parent education dashboard.">
  <meta name="theme-color" content="#5968F2">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="StarForge EDU">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>StarForge EDU Family</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; min-height: 100%; background: #F3F5F9; }
    #sf-loader {
      position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center;
      background: #F3F5F9; color: #111827; font-family: system-ui, sans-serif;
      transition: opacity .22s ease;
    }
    .sf-loader-card { display: grid; justify-items: center; gap: 14px; }
    .sf-loader-mark {
      width: 58px; height: 58px; display: grid; place-items: center;
      border-radius: 18px; background: #5968F2; color: white; font-size: 28px;
      box-shadow: 0 16px 38px rgba(89, 104, 242, .24);
    }
    .sf-loader-title { font-size: 16px; font-weight: 800; letter-spacing: .02em; }
    .sf-loader-line { width: 128px; height: 3px; overflow: hidden; border-radius: 99px; background: #E3E7EF; }
    .sf-loader-line::after {
      content: ""; display: block; width: 52px; height: 100%; border-radius: inherit;
      background: #5968F2; animation: sf-loading 1s ease-in-out infinite alternate;
    }
    @keyframes sf-loading { from { transform: translateX(-10px); } to { transform: translateX(86px); } }
  </style>
</head>
<body>
  <div id="sf-loader" role="status" aria-label="StarForge yuklanmoqda">
    <div class="sf-loader-card">
      <div class="sf-loader-mark" aria-hidden="true">✦</div>
      <div class="sf-loader-title">StarForge EDU</div>
      <div class="sf-loader-line" aria-hidden="true"></div>
    </div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('sf-loader');
      if (!loader) return;
      loader.style.opacity = '0';
      window.setTimeout(function () { loader.remove(); }, 240);
    });
  </script>
</body>
</html>
